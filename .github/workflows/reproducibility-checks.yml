name: Reproducibility checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quick-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the pinned Python environment
        run: python -m pip install -r requirements-lock.txt
      - name: Validate the development data
        run: python training/saf_reproduce.py validate --input data/development.csv
      - name: Recompute development descriptors
        run: >-
          python scripts/compute_descriptors.py
          --input data/development.csv
          --output run_outputs/development_descriptor_audit.csv
          --report run_outputs/development_descriptor_audit.json
          --verify-existing --tolerance 1e-9
      - name: Recompute held-out descriptors
        run: >-
          python scripts/compute_descriptors.py
          --input data/held_out_test.csv
          --output run_outputs/heldout_descriptor_audit.csv
          --report run_outputs/heldout_descriptor_audit.json
          --verify-existing --tolerance 1e-9
      - name: Reproduce the internal held-out evaluation
        run: >-
          python scripts/evaluate_heldout.py
          --data data/held_out_test.csv
          --model models/SAF_Predict_public_model_bundle_v1.joblib
          --reference-dir validation
          --output-dir run_outputs/heldout
      - name: Check browser and Python numerical parity
        run: node tests/test_js_against_python_reference_cases.js
      - name: Run release-integrity checks
        run: >-
          python scripts/run_release_qa.py
          --node "$(command -v node)"
          --verify-release-manifest
